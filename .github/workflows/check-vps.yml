name: Check VPS
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: VPS status
        uses: appleboy/ssh-action@v1
        timeout-minutes: 3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 60
          script: |
            echo "=== TIME ==="; date
            echo "=== UPTIME/LOAD ==="; uptime
            echo "=== MEM ==="; free -m
            echo "=== DISK ==="; df -h /
            echo "=== SERVICES ==="
            for s in nginx php8.3-fpm mariadb redis-server; do
              printf "%-16s %s\n" "$s" "$(systemctl is-active $s 2>/dev/null)"
            done
            echo "=== TOP PROCS ==="; ps aux --sort=-%cpu | head -8
            echo "=== GIT STATUS ==="
            cd /var/www/devanka-logistik 2>/dev/null && git status --short | head -5 && git log --oneline -1
            echo "=== COMPOSER RUNNING? ==="; pgrep -af composer | head -3 || echo "no composer"
            echo "=== GIT RUNNING? ==="; pgrep -af "git" | head -3 || echo "no git"
            echo "=== NGINX ERROR LOG ==="; sudo tail -5 /var/log/nginx/error.log 2>/dev/null
            echo "=== PHP-FPM ERROR ==="; sudo tail -5 /var/log/php8.3-fpm.log 2>/dev/null || echo "(no fpm log)"
            echo "=== LARAVEL LOG ==="; sudo tail -5 /var/www/devanka-logistik/storage/logs/laravel.log 2>/dev/null
