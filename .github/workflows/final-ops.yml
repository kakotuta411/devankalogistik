name: Final Ops
on:
  workflow_dispatch:
    inputs:
      slack_webhook:
        description: 'Slack Incoming Webhook URL (kosongkan kalau belum ada)'
        required: false

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify rclone + setup monitor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git stash 2>/dev/null || true
            git pull origin master 2>&1
            echo "=== RCLONE: list bucket ==="
            sudo rclone lsd devanka-b2:devanka-backup 2>&1 | head -5
            echo "--- rclone version ---"
            rclone version 2>/dev/null | head -1 || echo "(rclone tidak ada)"
            echo ""
            echo "=== MONITOR: pasang cron ==="
            chmod +x monitor.sh
            WEBHOOK='${{ github.event.inputs.slack_webhook }}'
            if [ -n "$WEBHOOK" ]; then
              printf '*/5 * * * * root SLACK_WEBHOOK=%s /var/www/devanka-logistik/monitor.sh\n' "$WEBHOOK" | sudo tee /etc/cron.d/vps-monitor
            else
              echo '*/5 * * * * root /var/www/devanka-logistik/monitor.sh' | sudo tee /etc/cron.d/vps-monitor
            fi
            sudo chmod 644 /etc/cron.d/vps-monitor
            cat /etc/cron.d/vps-monitor
            echo ""
            echo "=== MONITOR: test run ==="
            sudo bash monitor.sh
            echo "--- log terakhir ---"
            sudo tail -5 /var/log/devanka-monitor.log 2>/dev/null || echo "(log belum ada)"