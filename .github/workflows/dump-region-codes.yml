name: Dump Region Codes
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump all region codes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            cat > /tmp/dump_codes.php << 'PHPEOF'
            <?php
            require '/var/www/devanka-logistik/vendor/autoload.php';
            $app = require '/var/www/devanka-logistik/bootstrap/app.php';
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            use Illuminate\Support\Facades\DB;

            $codes = [];
            $cols = ['province_code','regency_code','district_code','village_code',
                     'customer_province_code','customer_regency_code','customer_district_code','customer_village_code',
                     'sender_province_code','sender_regency_code','sender_district_code','sender_village_code',
                     'receiver_province_code','receiver_regency_code','receiver_district_code','receiver_village_code'];
            foreach (['customers','invoices','shipments'] as $table) {
                DB::table($table)->get()->each(function($row) use (&$codes, $cols) {
                    foreach ($cols as $col) {
                        if (!empty($row->$col)) $codes[] = $row->$col;
                    }
                });
            }
            $unique = array_values(array_unique($codes));
            sort($unique);
            echo 'TOTAL UNIQUE: '.count($unique).PHP_EOL;
            foreach ($unique as $c) echo $c.PHP_EOL;
            PHPEOF
            sudo -u www-data /usr/bin/php8.3 /tmp/dump_codes.php
            rm -f /tmp/dump_codes.php