name: Check Access 4xx
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check 4xx/5xx in access log
        uses: appleboy/ssh-action@v1
        timeout-minutes: 5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 60s
          script: |
            cd /var/www/devanka-logistik
            git stash 2>/dev/null || true
            git pull origin master 2>&1 | tail -1
            echo "=== 4xx/5xx responses in access log (last 30) ==="
            sudo tail -30 /var/www/devanka-logistik/storage/logs/laravel.log 2>/dev/null | grep -iE "422|403|404|500|503|invalid|required" | tail -30
            echo "=== NGINX ACCESS LOG (last 30) ==="
            sudo tail -30 /var/log/nginx/access.log 2>/dev/null | awk '{print $9, $7, $11}' | tail -30
            echo "=== NGINX ERROR LOG (last 10) ==="
            sudo tail -10 /var/log/nginx/error.log 2>/dev/null | tail -10