name: Inspect & Clean Dummy Data
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect dummy data + clean
        uses: appleboy/ssh-action@v1
        timeout-minutes: 5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 60s
          script: |
            cd /var/www/devanka-logistik
            echo "=== CUSTOMERS ==="
            sudo -u www-data /usr/bin/php8.3 scripts/inspect-dummy.php
            echo "=== resi creation routes ==="
            sudo -u www-data /usr/bin/php8.3 artisan route:list --path=resi 2>/dev/null | head -20
            echo "=== error log tail ==="
            sudo tail -20 /var/www/devanka-logistik/storage/logs/laravel.log 2>/dev/null | tail -20
