<!-- Tracking Resi — paste this into WordPress (Custom HTML block) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
    .tracking-wrap {
        max-width: 960px;
        margin: 2rem auto;
    }

    .tracking-card {
        border: 1px solid #dee2e6;
        border-radius: 0.5rem;
        background-color: #fff !important;
    }

    .tracking-header {
        background-color: #E3F2FD !important;
        padding: 1rem;
        border-radius: 0.5rem 0.5rem 0 0;
    }

    .timeline {
        list-style: none;
        padding: 0;
        margin: 0;
        background: transparent !important;
    }

    .timeline li {
        position: relative;
        padding: 0.75rem 0 0.75rem 1.5rem;
        border-left: 2px solid #dee2e6;
        background: transparent !important;
    }

    .timeline li::before {
        content: "";
        position: absolute;
        left: -6px;
        top: 1rem;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #0d6efd;
    }

    .timeline li:last-child {
        border-left-color: transparent;
    }

    .status-badge {
        font-size: 0.85rem;
    }

    .detail-row {
        padding: 0.35rem 0;
        border-bottom: 1px solid #f0f0f0;
    }

    .detail-row:last-child {
        border-bottom: none;
    }
</style>

<div class="tracking-wrap">
    <!-- Form -->
    <div class="card tracking-card mb-4">
        <div class="tracking-header">
            <h4 class="mb-0"><i class="bi bi-search me-2"></i>Tracking Resi</h4>
        </div>
        <div class="card-body">
            <div class="input-group">
                <input type="text" id="resi-input" class="form-control"
                    placeholder="Masukkan nomor resi (min. 3 karakter)" />
                <button class="btn btn-primary" onclick="trackResi()">
                    <i class="bi bi-search me-1"></i>Cari
                </button>
            </div>
        </div>
    </div>

    <!-- Error -->
    <div id="tracking-error" class="alert alert-danger" style="display:none;"></div>

    <!-- Result: 2 columns -->
    <div id="tracking-result" style="display:none;">
        <div class="row g-3">
            <!-- Left: Detail -->
            <div class="col-md-5">
                <div class="card tracking-card h-100">
                    <div class="tracking-header">
                        <h5 class="mb-0">Info Pengiriman</h5>
                    </div>
                    <div class="card-body">
                        <div class="detail-row">
                            <small class="text-muted">No. Resi</small>
                            <div class="fw-bold" id="resi-no"></div>
                        </div>
                        <div class="detail-row">
                            <small class="text-muted">Tanggal Masuk</small>
                            <div id="entry-date"></div>
                        </div>
                        <div class="detail-row">
                            <small class="text-muted">Pengirim</small>
                            <div id="sender"></div>
                        </div>
                        <div class="detail-row">
                            <small class="text-muted">Penerima</small>
                            <div id="receiver"></div>
                        </div>
                        <div class="detail-row">
                            <small class="text-muted">Status</small>
                            <div><span id="status" class="badge status-badge"></span></div>
                        </div>
                        <div id="delivered-info" style="display:none;" class="detail-row">
                            <small class="text-muted">Diterima oleh</small>
                            <div id="receiver-name"></div>
                            <small class="text-muted mt-1 d-block">Tanggal Diterima</small>
                            <div id="delivered-at"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Timeline (no background) -->
            <div class="col-md-7">
                <div class="card tracking-card h-100">
                    <div class="tracking-header">
                        <h5 class="mb-0">Timeline Tracking</h5>
                    </div>
                    <div class="card-body">
                        <ul id="timeline" class="timeline"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'https://devankalogistik.web.id/api/tracking';

    async function trackResi() {
        const resi = document.getElementById('resi-input').value.trim();
        if (!resi) return;

        const resultDiv = document.getElementById('tracking-result');
        const errorDiv = document.getElementById('tracking-error');
        resultDiv.style.display = 'none';
        errorDiv.style.display = 'none';

        try {
            const res = await fetch(`${API_BASE}/${encodeURIComponent(resi)}`);
            if (!res.ok) {
                const err = await res.json();
                errorDiv.textContent = err.error || 'Resi tidak ditemukan';
                errorDiv.style.display = 'block';
                return;
            }
            const data = await res.json();

            document.getElementById('resi-no').textContent = data.resi_no;
            document.getElementById('entry-date').textContent = data.entry_date;
            document.getElementById('sender').textContent = data.sender;
            document.getElementById('receiver').textContent = data.receiver;

            const statusEl = document.getElementById('status');
            statusEl.textContent = data.shipment_status;
            statusEl.className = 'badge status-badge ' + statusClass(data.shipment_status);

            if (data.receiver_name) {
                document.getElementById('receiver-name').textContent = data.receiver_name;
                document.getElementById('delivered-at').textContent = data.delivered_at;
                document.getElementById('delivered-info').style.display = 'block';
            } else {
                document.getElementById('delivered-info').style.display = 'none';
            }

            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            data.tracking_events.forEach(function (ev) {
                const li = document.createElement('li');
                const time = document.createElement('div');
                time.className = 'text-muted small';
                time.textContent = ev.event_time;
                const type = document.createElement('div');
                type.className = 'fw-bold';
                type.textContent = ev.event_type + (ev.location ? ' — ' + ev.location : '');
                li.appendChild(time);
                li.appendChild(type);
                if (ev.notes) {
                    const note = document.createElement('div');
                    note.className = 'small text-secondary';
                    note.textContent = ev.notes;
                    li.appendChild(note);
                }
                timeline.appendChild(li);
            });

            resultDiv.style.display = 'block';
        } catch (e) {
            errorDiv.textContent = 'Gagal mengambil data. Coba lagi.';
            errorDiv.style.display = 'block';
        }
    }

    function statusClass(status) {
        switch (status) {
            case 'Delivered': return 'text-bg-success';
            case 'In Transit': return 'text-bg-warning';
            case 'Created': return 'text-bg-primary';
            case 'Cancelled': return 'text-bg-danger';
            default: return 'text-bg-secondary';
        }
    }

    document.getElementById('resi-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') trackResi();
    });
</script>
