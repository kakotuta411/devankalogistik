name: Diagnose 500
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check logs and config
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "=== Laravel log (last 50 lines) ==="
            tail -50 storage/logs/laravel.log
            echo ""
            echo "=== Redis status ==="
            redis-cli ping 2>&1
            echo ""
            echo "=== PHP-FPM status ==="
            sudo systemctl status php8.3-fpm --no-pager | head -5
            echo ""
            echo "=== .env cache/session ==="
            grep -E "^(CACHE_DRIVER|SESSION_DRIVER|QUEUE_CONNECTION|REDIS_)" .env
            echo ""
            echo "=== Test Redis connection from PHP ==="
            sudo -u www-data /usr/bin/php8.3 -r "
            try {
                \$r = new Redis();
                \$r->connect('127.0.0.1', 6379);
                echo 'Redis connect: OK' . PHP_EOL;
                echo 'Redis ping: ' . \$r->ping() . PHP_EOL;
            } catch (Exception \$e) {
                echo 'Redis connect: FAIL - ' . \$e->getMessage() . PHP_EOL;
            }
            "
            echo ""
            echo "=== Test Laravel cache ==="
            sudo -u www-data /usr/bin/php8.3 artisan tinker --execute="
            try {
                \Illuminate\Support\Facades\Cache::put('test', 'ok', 10);
                echo 'Cache put: OK' . PHP_EOL;
                echo 'Cache get: ' . \Illuminate\Support\Facades\Cache::get('test') . PHP_EOL;
            } catch (\Exception \$e) {
                echo 'Cache: FAIL - ' . \$e->getMessage() . PHP_EOL;
            }
            "
            echo ""
            echo "=== Test session ==="
            sudo -u www-data /usr/bin/php8.3 artisan tinker --execute="
            try {
                \Illuminate\Support\Facades\Session::put('test', 'ok');
                echo 'Session put: OK' . PHP_EOL;
            } catch (\Exception \$e) {
                echo 'Session: FAIL - ' . \$e->getMessage() . PHP_EOL;
            }
            "