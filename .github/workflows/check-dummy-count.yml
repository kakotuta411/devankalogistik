name: Check Dummy Data
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check dummy data counts on VPS
        uses: appleboy/ssh-action@v1
        timeout-minutes: 5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 60s
          script: |
            cd /var/www/devanka-logistik
            git stash 2>/dev/null || true
            git pull origin master 2>&1 | tail -1
            echo "=== CUSTOMERS ==="
            sudo -u www-data /usr/bin/php8.3 scripts/check-counts.php
