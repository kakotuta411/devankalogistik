name: debug-case3

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect data
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /var/www/devanka-logistik
            sudo -u www-data /usr/bin/php8.3 artisan tinker --execute="
              echo '=== SHIPMENTS ===' . PHP_EOL;
              App\Models\Shipment::withoutGlobalScopes()->get(['id','resi_no','customer_id','po_number','origin_branch_id','shipment_status'])->each(function(\$s) {
                echo \$s->resi_no . ' | cust=' . \$s->customer_id . ' | po=' . var_export(\$s->po_number, true) . ' | orig=' . \$s->origin_branch_id . PHP_EOL;
              });

              echo PHP_EOL . '=== PO ===' . PHP_EOL;
              App\Models\PurchaseOrder::all(['id','po_number','customer_id','status'])->each(function(\$p) {
                echo 'po=' . \$p->po_number . ' | cust=' . \$p->customer_id . ' | ' . \$p->status . PHP_EOL;
              });

              echo PHP_EOL . '=== INVOICES ===' . PHP_EOL;
              App\Models\Invoice::all(['id','invoice_no','po_id','invoice_status'])->each(function(\$i) {
                echo \$i->invoice_no . ' | po=' . \$i->po_id . ' | ' . \$i->invoice_status . PHP_EOL;
              });

              echo PHP_EOL . '=== EXCLUDED PO (active invoices) ===' . PHP_EOL;
              \$activeInvoiceIds = App\Models\Invoice::where('invoice_status','!=','Cancelled')->pluck('id')->toArray();
              echo 'activeInvoiceIds=' . json_encode(\$activeInvoiceIds) . PHP_EOL;
              \$excluded = App\Models\InvoiceItem::whereIn('invoice_id',\$activeInvoiceIds)
                  ->join('shipments','invoice_items.shipment_id','=','shipments.id')
                  ->whereNotNull('shipments.po_number')
                  ->pluck('shipments.po_number')->unique()->toArray();
              echo 'excluded=' . json_encode(\$excluded) . PHP_EOL;

              echo PHP_EOL . '=== QUERY PER CUSTOMER ===' . PHP_EOL;
              foreach (['PT Egaraya','PT MANDIRI BANGUNAN','PT Mandiri Project Utama'] as \$name) {
                \$cust = App\Models\Customer::where('name',\$name)->first();
                if (!\$cust) { echo \$name . ' => CUSTOMER NOT FOUND' . PHP_EOL; continue; }
                \$found = App\Models\Shipment::where('customer_id',\$cust->id)
                    ->where(function(\$q) use (\$excluded) { \$q->whereNull('po_number')->orWhereNotIn('po_number',\$excluded); })
                    ->count();
                echo \$name . ' (' . \$cust->id . ') => resi ditemukan: ' . \$found . PHP_EOL;
              }
            " 2>&1 | tail -40
