name: Check Resi Error
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check resi creation errors
        uses: appleboy/ssh-action@v1
        timeout-minutes: 5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 60s
          script: |
            cd /var/www/devanka-logistik
            git stash 2>/dev/null || true
            git pull origin master 2>&1 | tail -1
            echo "=== RECENT PRODUCTION ERRORS (last 10) ==="
            sudo tail -10 /var/www/devanka-logistik/storage/logs/laravel.log 2>/dev/null | grep -iE "production.ERROR|Exception|error" | tail -10
            echo "=== ROUTES (shipment create) ==="
            sudo -u www-data /usr/bin/php8.3 artisan route:list 2>/dev/null | grep -iE "shipment.*store|store|resi" | head -10