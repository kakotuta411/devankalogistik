name: Cleanup Public PDFs
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove public preview PDFs
        uses: appleboy/ssh-action@v1
        timeout-minutes: 3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 60s
          script: |
            rm -f /var/www/devanka-logistik/public/prod-resi-detail.pdf
            rm -f /var/www/devanka-logistik/public/prod-resi-label.pdf
            rm -f /var/www/devanka-logistik/public/prod-manifest.pdf
            echo "cleaned"
            ls /var/www/devanka-logistik/public/prod-*.pdf 2>/dev/null || echo "no prod PDFs left"
