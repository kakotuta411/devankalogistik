name: Gen Prod PDF
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate PDFs on VPS
        uses: appleboy/ssh-action@v1
        timeout-minutes: 5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 120s
          script: |
            cd /var/www/devanka-logistik
            git stash 2>/dev/null || true
            git pull origin master 2>&1 | tail -1
            sudo -u www-data /usr/bin/php8.3 scripts/gen-prod-pdf.php
            sudo chown www-data:www-data public/prod-resi-detail.pdf public/prod-resi-label.pdf
            ls -lh public/prod-resi-*.pdf
