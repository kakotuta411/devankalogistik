name: diagnose-shipment-500

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check logs + test shipment create
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "=== LAST 80 LINES LARAVEL LOG ==="
            sudo tail -80 /var/www/devanka-logistik/storage/logs/laravel.log 2>/dev/null || echo "No laravel.log"
            echo ""
            echo "=== NGINX ERROR LOG (last 30) ==="
            sudo tail -30 /var/log/nginx/error.log 2>/dev/null || echo "No nginx error log"
            echo ""
            echo "=== PHP-FPM STATUS ==="
            sudo systemctl status php8.3-fpm --no-pager | head -15
            echo ""
            echo "=== GIT LOG VPS ==="
            cd /var/www/devanka-logistik && git log --oneline -3
            echo ""
            echo "=== TEST SHIPMENT CREATE VIA TINKER ==="
            sudo -u www-data /usr/bin/php8.3 artisan tinker --execute="
              try {
                \$branch = App\Models\Branch::first();
                echo 'Branch: ' . (\$branch ? \$branch->city : 'NONE') . PHP_EOL;
                \$s = App\Models\Shipment::create([
                  'destination_branch_id' => \$branch ? \$branch->id : null,
                  'sender_name' => 'Test',
                  'receiver_name' => 'Test',
                  'total_koli' => 1,
                  'total_weight' => 1,
                  'service_type' => 'reguler',
                ]);
                echo 'Shipment created: ' . \$s->resi_no . PHP_EOL;
              } catch (\Throwable \$e) {
                echo 'ERROR: ' . \$e->getMessage() . PHP_EOL;
                echo 'FILE: ' . \$e->getFile() . ':' . \$e->getLine() . PHP_EOL;
                echo 'TRACE: ' . substr(\$e->getTraceAsString(), 0, 2000) . PHP_EOL;
              }
            " 2>&1 | tail -40
            echo ""
            echo "=== CLEAR LOG ==="
            sudo sh -c '> /var/www/devanka-logistik/storage/logs/laravel.log'
            echo "Log cleared. Now test via HTTP POST /login:"
            curl -s -o /dev/null -w "GET /login: %{http_code}\n" https://devankalogistik.web.id/login
            echo ""
            echo "=== NEW LOG ENTRIES ==="
            sudo tail -40 /var/www/devanka-logistik/storage/logs/laravel.log 2>/dev/null || echo "No new entries"
