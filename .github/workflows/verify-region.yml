name: Verify Region Data
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify region data
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            sudo -u www-data /usr/bin/php8.3 artisan tinker --execute="
            echo 'Provinsi: '.\App\Models\Region::where('level','province')->count().PHP_EOL;
            echo 'Kabupaten: '.\App\Models\Region::where('level','regency')->count().PHP_EOL;
            echo 'Kecamatan: '.\App\Models\Region::where('level','district')->count().PHP_EOL;
            echo 'Desa: '.\App\Models\Region::where('level','village')->count().PHP_EOL;
            echo '--- data existing ---'.PHP_EOL;
            \\App\\Models\\Customer::whereNotNull('province_code')->get()->each(function(\$c) {
                \$r = \\App\\Models\\Region::where('code', \$c->village_code)->first();
                echo 'Customer '.\$c->name.': '.\$c->regency_code.'/'.\$c->district_code.'/'.\$c->village_code.' => '.(\$r ? \$r->name : 'TIDAK DITEMUKAN').PHP_EOL;
            });
            \\App\\Models\\Shipment::whereNotNull('receiver_province_code')->get()->each(function(\$s) {
                \$r = \\App\\Models\\Region::where('code', \$s->receiver_village_code)->first();
                echo 'Shipment '.\$s->resi_no.' receiver: '.\$s->receiver_regency_code.'/'.\$s->receiver_district_code.'/'.\$s->receiver_village_code.' => '.(\$r ? \$r->name : 'TIDAK DITEMUKAN').PHP_EOL;
            });
            "