services:
  mysql:
    image: mariadb:11
    container_name: lt-hosting-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: logistik_min
      MARIADB_USER: logistik
      MARIADB_PASSWORD: logistikpass123
      MARIADB_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lt-hosting-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=logistik_min
      - DB_USERNAME=logistik
      - DB_PASSWORD=logistikpass123

  nginx:
    image: nginx:alpine
    container_name: lt-hosting-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

