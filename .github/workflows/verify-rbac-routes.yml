name: Verify RBAC Routes
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify RBAC routes
        uses: appleboy/ssh-action@v1
        timeout-minutes: 5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 60s
          script: |
            cd /var/www/devanka-logistik
            git stash 2>/dev/null || true
            git pull origin master 2>&1 | tail -1
            echo "=== Dashboard route (expect role:Admin,Management_View,Head_of_Branch) ==="
            sudo -u www-data /usr/bin/php8.3 artisan route:list 2>/dev/null | grep -E "GET|POST" | grep -E "dashboard|/invoices|/shipments" 
            echo "=== Login redirect check ==="
            sudo -u www-data /usr/bin/php8.3 artisan tinker --execute="
            echo \"Staff_Invoice redirect: \";
            \$r = \$emerging = null;
            " 2>/dev/null || echo "tinker check skipped"
