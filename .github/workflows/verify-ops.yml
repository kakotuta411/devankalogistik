name: Verify Ops
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ops setup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "=== CRON FILES ==="
            ls -la /etc/cron.d/
            echo ""
            echo "=== MONITOR CRON ==="
            cat /etc/cron.d/vps-monitor 2>/dev/null || echo "(belum ada)"
            echo ""
            echo "=== MONITOR LOG ==="
            sudo tail -5 /var/log/devanka-monitor.log 2>/dev/null || echo "(belum ada)"
            echo ""
            echo "=== RCLONE CONFIG ==="
            sudo test -f /root/.config/rclone/rclone.conf && echo "config ADA" || echo "config BELUM ADA"
            echo ""
            echo "=== OFFSITE BACKUP CRON ==="
            cat /etc/cron.d/offsite-backup 2>/dev/null || echo "(belum ada)"
            echo ""
            echo "=== BACKUP FILES ==="
            ls -lh /backup/ 2>/dev/null | tail -5 || echo "(/backup kosong)"
            echo ""
            echo "=== RCLONE TEST ==="
            sudo rclone lsd devanka-b2:devanka-backup 2>&1 | head -5 || echo "(rclone test gagal)"