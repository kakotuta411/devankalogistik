name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, xml, curl, zip, gd, bcmath

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git stash 2>/dev/null || true
            git pull origin master
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache/data storage/logs bootstrap/cache
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo -u www-data /usr/bin/php8.3 artisan migrate --force
            sudo -u www-data /usr/bin/php8.3 artisan config:cache
            sudo -u www-data /usr/bin/php8.3 artisan route:cache
            sudo -u www-data /usr/bin/php8.3 artisan view:cache
            sudo -u www-data /usr/bin/php8.3 artisan optimize
            sudo systemctl restart php8.3-fpm
            echo "Deploy completed at $(date)"